<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hello World</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    img {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }

    button {
      padding: 6px 12px;
      font-size: 14px;
      background-color: #0078d4; /* blue */
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    button:hover {
      background-color: #106ebe;
    }

    .text {
      font-size: 28px;
      color: #1c1c1c;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/globe.png" alt="Globe icon">

    <button onclick="showText()">Push Button</button>

    <div id="message" class="text">Hello, World!</div>
  </div>

  <script>
    function showText() {
      document.getElementById("message").style.display = "block";
    }
  </script>
</body>
</html>
