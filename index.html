<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hello World</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    img {
      width: 32px;
      height: 32px;
      margin-bottom: 8px;
    }

    .text {
      font-size: 16px;
      color: #1c1c1c;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/globe.png" alt="Globe icon">
    <div class="text">Hello, World!</div>
  </div>
</body>
</html>
